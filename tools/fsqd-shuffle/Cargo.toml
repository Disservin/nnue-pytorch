[package]
name = "fsqd-shuffle"
version = "0.1.0"
edition = "2021"
description = "Join FSQD files into one file in uniformly random record order"
license = "GPL-3.0"

[dependencies]
four-square = { path = "../../four-square" }
clap = { version = "4", features = ["derive"] }
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 1
