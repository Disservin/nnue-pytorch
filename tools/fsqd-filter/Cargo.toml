[package]
name = "fsqd-filter"
version = "0.1.0"
edition = "2021"
description = "Convert binpacks to one FSQD file, keeping only positions the training data loader's skip filter accepts"
license = "GPL-3.0"
build = "build.rs"

[dependencies]
four-square = { path = "../../four-square" }
clap = { version = "4", features = ["derive"] }
walkdir = "2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 1
